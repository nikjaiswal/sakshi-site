name: Validate site

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render profile pages from profiles-data/
        run: npm run build
      - name: Validate HTML
        run: npm run validate
      - name: Check internal links
        run: npm run check-links
